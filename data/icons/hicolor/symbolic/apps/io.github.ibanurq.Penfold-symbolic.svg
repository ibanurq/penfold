<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="12 7 104 104">
  <!-- Penfold's drawing in one color: a sheet behind, a front sheet with lines of text and a highlighted line, and a
       highlighter pen. The holes in the front sheet are a mask, so GTK can paint the rest in the text colour. -->
  <defs>
    <mask id="front-sheet-holes" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <rect x="35" y="29" width="26" height="6" rx="3" fill="#000"/>
      <rect x="35" y="42" width="46" height="5" rx="2.5" fill="#000"/>
      <rect x="33" y="55" width="43" height="14" rx="4" fill="#000"/>
      <rect x="38" y="60.5" width="33" height="3" rx="1.5" fill="#fff"/>
      <rect x="35" y="76" width="46" height="5" rx="2.5" fill="#000"/>
      <rect x="35" y="86" width="28" height="5" rx="2.5" fill="#000"/>
      <g transform="translate(77 66) rotate(40) scale(.88)" fill="#000" stroke="#000" stroke-width="8" stroke-linejoin="round">
        <rect x="-8" y="-46" width="16" height="38" rx="3.5"/>
        <polygon points="-3,0 3,0 6,-9 -6,-9"/>
        <rect x="-7" y="-56" width="14" height="14" rx="4"/>
      </g>
    </mask>
  </defs>
  <rect x="26" y="18" width="64" height="84" rx="8" fill="none" stroke="#000" stroke-width="5" opacity=".55" transform="translate(-4 1) rotate(-14 58 62)"/>
  <rect x="26" y="18" width="64" height="84" rx="8" mask="url(#front-sheet-holes)"/>
  <g transform="translate(77 66) rotate(40) scale(.88)">
    <polygon points="-3,0 3,0 6,-9 -6,-9"/>
    <rect x="-8" y="-46" width="16" height="38" rx="3.5"/>
    <rect x="-7" y="-56" width="14" height="14" rx="4"/>
    <rect x="6" y="-54" width="3.5" height="22" rx="1.75"/>
  </g>
</svg>
