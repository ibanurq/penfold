<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Penfold</title>
  <!-- The drawing is enlarged 1.2 times and centred, so it fills the canvas like other GNOME app icons -->
  <g transform="translate(64 64) scale(1.2) translate(-60.6 -63.3)">
  <!-- Back sheet: warm cream -->
  <g transform="translate(-6 2) rotate(-20 58 62)">
    <rect x="28" y="22" width="64" height="84" rx="6" fill="#000" opacity="0.10"/>
    <rect x="26" y="18" width="64" height="84" rx="6" fill="#f3e4b8" stroke="#dcc88f" stroke-width="1"/>
  </g>
  <!-- Middle sheet: mint green -->
  <g transform="translate(-3 1) rotate(-10 58 62)">
    <rect x="28" y="22" width="64" height="84" rx="6" fill="#000" opacity="0.10"/>
    <rect x="26" y="18" width="64" height="84" rx="6" fill="#cfeadf" stroke="#aed2c2" stroke-width="1"/>
  </g>
  <!-- Front sheet -->
  <rect x="28" y="21" width="64" height="84" rx="6" fill="#000" opacity="0.12"/>
  <rect x="26" y="18" width="64" height="84" rx="6" fill="#fffefa" stroke="#dfe6e2" stroke-width="1"/>
  <!-- Title -->
  <rect x="35" y="29" width="26" height="5" rx="2.5" fill="#0c8599"/>
  <!-- Highlight -->
  <rect x="33" y="57" width="43" height="12" rx="3" fill="#ffe14d"/>
  <!-- Lines of text -->
  <rect x="35" y="42" width="46" height="4" rx="2" fill="#c3cfca"/>
  <rect x="35" y="51" width="40" height="4" rx="2" fill="#c3cfca"/>
  <rect x="35" y="61" width="42" height="4" rx="2" fill="#8fa29b"/>
  <rect x="35" y="75" width="46" height="4" rx="2" fill="#c3cfca"/>
  <rect x="35" y="84" width="28" height="4" rx="2" fill="#c3cfca"/>
  <!-- Highlighter pen -->
  <g transform="translate(77 66) rotate(40) scale(0.88)">
    <rect x="-6" y="-45" width="14" height="40" rx="3" fill="#000" opacity="0.15"/>
    <polygon points="-3,0 3,0 6,-9 -6,-9" fill="#ffe14d"/>
    <polygon points="-3,0 3,0 4.2,-3.5 -4.2,-3.5" fill="#e8c82e"/>
    <rect x="-8" y="-46" width="16" height="38" rx="3.5" fill="#0c8599"/>
    <rect x="-8" y="-31" width="16" height="6" fill="#99e9f2"/>
    <rect x="-7" y="-56" width="14" height="14" rx="4" fill="#086b7a"/>
    <rect x="6" y="-54" width="3.5" height="22" rx="1.75" fill="#086b7a"/>
    <rect x="-5" y="-44" width="2.6" height="32" rx="1.3" fill="#fff" opacity="0.35"/>
  </g>
  </g>
</svg>
