<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Penfold</title>
  <!-- Colours from the GNOME palette. Each sheet has a darker edge below it and a thin border in the same darker
       tone, as GNOME app icons do. The drawing is enlarged 1.2 times and centred, so it fills the canvas like other
       GNOME app icons -->
  <g transform="translate(64 64) scale(1.2) translate(-60.6 -63.3)">
  <!-- Back sheet: Yellow 3, edge Yellow 5 -->
  <g transform="translate(-6 2) rotate(-20 58 62)">
    <rect x="26" y="22" width="64" height="84" rx="6" fill="#e5a50a"/>
    <rect x="26" y="18" width="64" height="84" rx="6" fill="#f6d32d" stroke="#e5a50a" stroke-width="1"/>
  </g>
  <!-- Middle sheet: Green 3, edge Green 5 -->
  <g transform="translate(-3 1) rotate(-10 58 62)">
    <rect x="26" y="22" width="64" height="84" rx="6" fill="#26a269"/>
    <rect x="26" y="18" width="64" height="84" rx="6" fill="#33d17a" stroke="#26a269" stroke-width="1"/>
  </g>
  <!-- Front sheet: white, edge Light 3 -->
  <rect x="26" y="22" width="64" height="84" rx="6" fill="#deddda"/>
  <rect x="26" y="18" width="64" height="84" rx="6" fill="#ffffff" stroke="#deddda" stroke-width="1"/>
  <!-- Title -->
  <rect x="35" y="29" width="26" height="5" rx="2.5" fill="#3584e4"/>
  <!-- Highlight -->
  <rect x="33" y="57" width="43" height="12" rx="3" fill="#f8e45c"/>
  <!-- Lines of text -->
  <rect x="35" y="42" width="46" height="4" rx="2" fill="#c0bfbc"/>
  <rect x="35" y="51" width="40" height="4" rx="2" fill="#c0bfbc"/>
  <rect x="35" y="61" width="42" height="4" rx="2" fill="#77767b"/>
  <rect x="35" y="75" width="46" height="4" rx="2" fill="#c0bfbc"/>
  <rect x="35" y="84" width="28" height="4" rx="2" fill="#c0bfbc"/>
  <!-- Highlighter pen: Blue 3 with a Blue 5 side, so it looks round -->
  <g transform="translate(77 66) rotate(40) scale(0.88)">
    <polygon points="-3,0 3,0 6,-9 -6,-9" fill="#f8e45c"/>
    <polygon points="-3,0 3,0 4.2,-3.5 -4.2,-3.5" fill="#e5a50a"/>
    <rect x="-8" y="-46" width="16" height="38" rx="3.5" fill="#1a5fb4"/>
    <rect x="-8" y="-46" width="13" height="38" rx="3.5" fill="#3584e4"/>
    <rect x="-8" y="-31" width="16" height="6" fill="#99c1f1"/>
    <rect x="-7" y="-56" width="14" height="14" rx="4" fill="#1a5fb4"/>
    <rect x="6" y="-54" width="3.5" height="22" rx="1.75" fill="#1a5fb4"/>
  </g>
  </g>
</svg>
