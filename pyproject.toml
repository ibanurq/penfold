# Configuration of the development tools (Ruff, mypy, pytest).
# Penfold is built and installed with Meson (meson.build), not from this file.

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["node_modules", "notas_privadas"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # import order
    "N",    # naming
    "D",    # docstrings
    "UP",   # modern Python syntax
    "B",    # likely bugs
    "C4",   # comprehensions
    "C90",  # cyclomatic complexity
    "SIM",  # simplifications
    "RET",  # return statements
    "ARG",  # unused arguments
    "PIE",  # unnecessary code
    "PTH",  # pathlib instead of os.path
    "PT",   # pytest style
    "ERA",  # commented-out code
    "BLE",  # blind except
    "PL",   # Pylint
    "RUF",  # Ruff-specific
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Test names already say what they check. Interface modules are imported inside the tests, once the fixtures have
# loaded the resources their window templates need. Expected values are written as they are, not as constants.
"tests/**" = ["D103", "PLC0415", "PLR2004"]

[tool.mypy]
python_version = "3.13"
files = ["penfold", "tests"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
extra_checks = true

# The document layer has no GTK and carries the risk of losing data: strict mode (03-arquitectura, 1.1).
[[tool.mypy.overrides]]
module = "penfold.document.*"
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
